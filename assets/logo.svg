<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Loup-Garou RPS — logo</title>
  <defs>
    <path id="arcHaut" d="M 60 200 A 140 140 0 0 1 340 200"/>
    <path id="arcBas" d="M 52 200 A 148 148 0 0 0 348 200"/>
